<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nex &amp; Bridge — Agentic Enterprise</title>
<meta name="description" content="넥스앤브릿지는 기업의 지식·데이터·업무 Agent·운영체계를 연결해 Agentic Enterprise를 구축합니다. Nex &amp; Bridge builds Agentic Enterprise — connecting enterprise knowledge, data, agents and operations.">
<link rel="alternate" hreflang="ko" href="https://nexenbridge.com/ko/">
<link rel="alternate" hreflang="en" href="https://nexenbridge.com/en/">
<link rel="alternate" hreflang="x-default" href="https://nexenbridge.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<!--
  Language gate. GitHub Pages has no server, so this can't do a real
  Accept-Language redirect -- it redirects client-side on navigator.language
  instead, and shows two buttons underneath for anyone who lands here before
  the redirect fires (or has JS off). Default on no-JS / unknown language is
  Korean, since that's who actually reaches this site today.
-->
<script>
(function () {
  var lang = (navigator.language || navigator.userLanguage || 'ko').toLowerCase();
  var target = lang.indexOf('ko') === 0 ? '/ko/' : '/en/';
  window.location.replace(target);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/ko/"></noscript>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(165deg,#00338D 0%,#001F5B 55%,#001240 100%);
  font-family:'Pretendard','DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;padding:2rem}
.wrap{text-align:center;max-width:560px}
.logo{font-family:'DM Sans',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:-.02em;margin-bottom:2.5rem}
.logo span{color:#00A3E0;font-weight:300}
.tag{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:#00A3E0;margin-bottom:1.4rem}
h1{font-size:clamp(1.6rem,4.5vw,2.2rem);font-weight:700;line-height:1.4;margin-bottom:2.6rem;letter-spacing:-.02em}
.choices{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.choice{display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:160px;
  padding:1rem 2rem;border:1px solid rgba(255,255,255,.3);border-radius:6px;
  text-decoration:none;color:#fff;transition:all .25s}
.choice:hover{background:#fff;color:#00338D;border-color:#fff}
.choice .lg{font-size:1rem;font-weight:600}
.choice .native{font-size:.75rem;opacity:.7}
.redirect-note{margin-top:2.2rem;font-size:.72rem;color:rgba(255,255,255,.4);font-family:'JetBrains Mono',monospace;letter-spacing:.05em}
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">Nex <span>&amp;</span> Bridge</div>
  <div class="tag">Agentic Enterprise</div>
  <h1>기업 지식과 데이터를 Agent의 판단과 실행으로 연결합니다<br>
  <span style="opacity:.6;font-size:.85em">Connecting enterprise knowledge and data into Agent-driven decisions</span></h1>

  <div class="choices">
    <a href="/ko/" class="choice">
      <span class="lg">한국어</span>
      <span class="native">Korean</span>
    </a>
    <a href="/en/" class="choice">
      <span class="lg">English</span>
      <span class="native">영어</span>
    </a>
  </div>

  <div class="redirect-note">자동으로 이동합니다 · redirecting automatically</div>
</div>

</body>
</html>
